[project]
name = "campfinder"
version = "0.26.1"
description = "Camp Finder pipeline: scrape/extract/validate/build Scouts BSA resident camp data"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
campfinder = "campfinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["campfinder*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
