document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-4e37-9058-7109450fc010\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"11f5d186-c757-4abf-a65d-a269ae3c63b8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fbbceb84-0019-4e94-be32-bc3ac5417938\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"ae468b4a-9a06-40e3-a920-7f2f5a9e1204\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{background:#EDEAE1;color:#20261F;font-family:\"Public Sans\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n  a{color:#1D5E42;text-decoration:none}\n  a:hover{color:#164A34;text-decoration:underline}\n  ::selection{background:#CBE0D0}\n  i[data-lucide]{display:inline-block;vertical-align:middle}\n  .sbnav a{color:#5C6A5B}\n  .sbnav a:hover{color:#20261F;text-decoration:none}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"max-width:1400px;margin:0 auto;padding:0 24px 120px\">\n\n  <!-- ============ COVER ============ -->\n  <header style=\"padding:72px 0 40px;border-bottom:1px solid #D8D3C6\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8A6A2E;margin-bottom:20px\">Design Handoff Package · v1<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:24px\">\n      <div style=\"width:52px;height:52px;border-radius:12px;background:#1D5E42;display:flex;align-items:center;justify-content:center;flex:0 0 auto\">\n        <i data-lucide=\"tent\" style=\"width:30px;height:30px;color:#F5F3EC\"><\u002Fi>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:34px;line-height:1;letter-spacing:-.02em\">Camp Finder<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5C6A5B;margin-top:6px\">campfinder.org · UX / UI design handoff<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:clamp(30px,4.4vw,56px);line-height:1.02;letter-spacing:-.025em;margin:0 0 18px;max-width:20ch\">Find a Scouts BSA resident summer camp your troop can actually get to.<\u002Fh1>\n    <p style=\"font-size:19px;line-height:1.55;color:#3C463C;max-width:62ch;margin:0 0 28px\">A free, static directory that filters resident summer camps by distance, available weeks, cost, and program, then sends troops to each camp's official council page to register. This document is the complete design spec: identity, tokens, iconography, every screen at mobile and desktop, all interaction states, component anatomy, map direction, microcopy, and accessibility notes.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <span style=\"display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #D8D3C6;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600\"><i data-lucide=\"smartphone\" style=\"width:15px;height:15px;color:#1D5E42\"><\u002Fi>Mobile-first · 375 / 768 / 1280<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #D8D3C6;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600\"><i data-lucide=\"accessibility\" style=\"width:15px;height:15px;color:#1D5E42\"><\u002Fi>WCAG 2.1 AA<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #D8D3C6;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600\"><i data-lucide=\"zap\" style=\"width:15px;height:15px;color:#1D5E42\"><\u002Fi>Static · client-side filtering<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #D8D3C6;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600\"><i data-lucide=\"map\" style=\"width:15px;height:15px;color:#1D5E42\"><\u002Fi>MapLibre GL basemap<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ DISCLAIMER BANNER ============ -->\n  <div style=\"display:flex;gap:14px;align-items:flex-start;background:#FBF7EC;border:1px solid #E4D9BE;border-left:4px solid #B4791A;border-radius:10px;padding:16px 18px;margin:28px 0 8px\">\n    <i data-lucide=\"shield-alert\" style=\"width:22px;height:22px;color:#8A5A12;flex:0 0 auto;margin-top:2px\"><\u002Fi>\n    <p style=\"margin:0;font-size:15px;line-height:1.5;color:#4A3A16\"><strong>Unofficial community tool.<\u002Fstrong> Camp Finder is an independent directory. It is not affiliated with, endorsed by, or connected to Scouting America / the Boy Scouts of America. No BSA logos, the fleur-de-lis mark, or official color lockups are used anywhere in this design. The identity below is original.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ============ SECTION NAV ============ -->\n  <nav class=\"sbnav\" style=\"position:sticky;top:0;z-index:50;background:rgba(237,234,225,.92);backdrop-filter:blur(8px);border-bottom:1px solid #D8D3C6;margin:24px -24px 0;padding:12px 24px;display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace\">\n    <a href=\"#identity\">01 Identity<\u002Fa>\n    <a href=\"#tokens\">02 Tokens<\u002Fa>\n    <a href=\"#icons\">03 Icons<\u002Fa>\n    <a href=\"#home\">04 Home / Search<\u002Fa>\n    <a href=\"#detail\">05 Camp detail<\u002Fa>\n    <a href=\"#about\">06 About + 404<\u002Fa>\n    <a href=\"#states\">07 States<\u002Fa>\n    <a href=\"#components\">08 Components<\u002Fa>\n    <a href=\"#map\">09 Map + copy + a11y<\u002Fa>\n  <\u002Fnav>\n\n  <!-- ============ 01 IDENTITY ============ -->\n  <section id=\"identity\" style=\"padding:64px 0 0;scroll-margin-top:60px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8A6A2E;margin-bottom:10px\">01 · Identity<\u002Fdiv>\n    <h2 style=\"font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em;margin:0 0 12px\">Three wordmark directions<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.55;color:#3C463C;max-width:64ch;margin:0 0 28px\">All three are original, trademark-safe, and read as trustworthy outdoors, not travel marketing. Each uses a neutral trail / topo motif rather than any scouting insignia. My recommendation is <strong>A (Trailhead)<\u002Fstrong>: the tent-and-marker glyph reads instantly at 24px in the mobile header.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n\n      <!-- Direction A -->\n      <div style=\"background:#fff;border:2px solid #1D5E42;border-radius:14px;padding:26px;position:relative\">\n        <span style=\"position:absolute;top:14px;right:14px;background:#1D5E42;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px\">RECOMMENDED<\u002Fspan>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A6A2E;margin-bottom:20px\">Direction A<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\n          <div style=\"width:44px;height:44px;border-radius:10px;background:#1D5E42;display:flex;align-items:center;justify-content:center\"><i data-lucide=\"tent\" style=\"width:26px;height:26px;color:#F5F3EC\"><\u002Fi><\u002Fdiv>\n          <span style=\"font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:26px;letter-spacing:-.02em\">Camp Finder<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;padding:14px;background:#F5F3EC;border-radius:8px;margin-bottom:8px\"><i data-lucide=\"tent\" style=\"width:18px;height:18px;color:#1D5E42\"><\u002Fi><span style=\"font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:16px\">Camp Finder<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:13px;color:#5C6A5B;line-height:1.5\"><strong>Trailhead.<\u002Fstrong> Tent glyph in a rounded pine square. Warm, literal, scales to a 24px favicon. Pairs with topo-line section dividers.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Direction B -->\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:14px;padding:26px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A6A2E;margin-bottom:20px\">Direction B<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\n          <div style=\"width:44px;height:44px;border-radius:50%;border:2.5px solid #1D5E42;display:flex;align-items:center;justify-content:center\"><i data-lucide=\"mountain\" style=\"width:24px;height:24px;color:#1D5E42\"><\u002Fi><\u002Fdiv>\n          <span style=\"font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.01em\">Base<span style=\"color:#1D5E42\">Camp<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;padding:14px;background:#F5F3EC;border-radius:8px;margin-bottom:8px\"><i data-lucide=\"mountain\" style=\"width:18px;height:18px;color:#1D5E42\"><\u002Fi><span style=\"font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:16px\">BaseCamp<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:13px;color:#5C6A5B;line-height:1.5\"><strong>Base Camp.<\u002Fstrong> Ridgeline in a compass ring. Slightly more adventurous; the two-tone wordmark keeps it distinct from generic outdoor brands.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Direction C -->\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:14px;padding:26px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A6A2E;margin-bottom:20px\">Direction C<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\n          <div style=\"width:44px;height:44px;border-radius:10px;background:#F5F3EC;border:1px solid #D8D3C6;display:flex;align-items:center;justify-content:center\"><i data-lucide=\"map-pin\" style=\"width:24px;height:24px;color:#B5551F\"><\u002Fi><\u002Fdiv>\n          <span style=\"font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:24px;letter-spacing:-.02em\">Summer Camps<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;padding:14px;background:#F5F3EC;border-radius:8px;margin-bottom:8px\"><i data-lucide=\"map-pin\" style=\"width:18px;height:18px;color:#B5551F\"><\u002Fi><span style=\"font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:16px\">Summer Camps<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:13px;color:#5C6A5B;line-height:1.5\"><strong>Trail Marker.<\u002Fstrong> Map-pin in blaze orange, plain descriptive name. Most utilitarian and search-engine literal; least brandable.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 02 TOKENS ============ -->\n  <section id=\"tokens\" style=\"padding:64px 0 0;scroll-margin-top:60px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8A6A2E;margin-bottom:10px\">02 · Design tokens<\u002Fdiv>\n    <h2 style=\"font ize:15px;line-height:1.55;color:#4A3A16\"><strong>Not affiliated with Scouting America.<\u002Fstrong> Camp Finder is an independent community project. It is not endorsed by or connected to Scouting America or the Boy Scouts of America, and uses none of their trademarks.<\u002Fdiv>\n            <h4 style=\"font-family:'Libre Franklin';font-weight:700;font-size:20px;margin:28px 0 8px\">How we check data<\u002Fh4>\n            <p style=\"font-size:16px;line-height:1.65;color:#3C463C;margin:0 0 8px\">Each listing carries the date it was last checked against the council page. Anything not confirmed in the last 12 months is flagged as stale on both the card and the detail page, so you always know how fresh the numbers are.<\u002Fp>\n            <h4 style=\"font-family:'Libre Franklin';font-weight:700;font-size:20px;margin:28px 0 8px\">Found something wrong?<\u002Fh4>\n            <p style=\"font-size:16px;line-height:1.65;color:#3C463C;margin:0 0 16px\">Fees change, weeks fill, links move. If a listing is off, tell us and we will check it against the council page.<\u002Fp>\n            <a href=\"#about\" style=\"display:inline-flex;align-items:center;gap:8px;background:#1D5E42;color:#fff;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;text-decoration:none\">Suggest a correction<i data-lucide=\"arrow-right\" style=\"width:16px;height:16px\"><\u002Fi><\u002Fa>\n          <\u002Fdiv>\n          <!-- FOOTER chrome -->\n          <div style=\"background:#20261F;color:#CDD4CA;padding:28px 32px\">\n            <div style=\"display:flex;gap:28px;flex-wrap:wrap;justify-content:space-between\">\n              <div style=\"max-width:320px\"><div style=\"display:flex;align-items:center;gap:9px;margin-bottom:10px\"><div style=\"width:28px;height:28px;border-radius:7px;background:#2C6B4E;display:flex;align-items:center;justify-content:center\"><i data-lucide=\"tent\" style=\"width:17px;height:17px;color:#fff\"><\u002Fi><\u002Fdiv><span style=\"font-family:'Libre Fra ex;align-items:center;justify-content:space-between;font-size:14px\"><span>Space available<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;background:#E4F0E7;color:#1E5B33;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700\"><i data-lucide=\"check\" style=\"width:13px;height:13px\"><\u002Fi>Open<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:14px\"><span>Waitlist only<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;background:#F6ECD6;color:#6F4A10;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700\"><i data-lucide=\"clock\" style=\"width:13px;height:13px\"><\u002Fi>Waitlist<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#8A8577\"><span>Session filled<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;background:#F6E1DE;color:#8F2E24;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700\"><i data-lucide=\"x\" style=\"width:13px;height:13px\"><\u002Fi>Full<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:14px\"><span>Status not known<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;background:#E8E6DE;color:#4A5348;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700\"><i data-lucide=\"help-circle\" style=\"width:13px;height:13px\"><\u002Fi>Unknown<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:14px\"><span>Registration not open<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;background:#E8E6DE;color:#4A5348;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700\"><i data-lucide=\"calendar-clock\" style=\"width:13px;height:13px\"><\u002Fi>Opens Jan 6<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:14px;border-top:1px dashed #E4DFD3;padding-top:10px\"><span>Fee unknown<\u002Fspan><span style=\"color:#8A8577;font-style:italic;font-size:13px\">Fee TBD · confirm on council site<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:14px\"><span>Dates unconfirmed<\u002Fspan><span style=\"color:#8A8577;font-style:italic;font-size:13px\">Dates TBD<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <h3 style=\"font-family:'Libre Franklin';font-weight:700;font-size:18px;margin:0 0 14px\">Error &amp; recovery<\u002Fh3>\n        <div style=\"border:1px solid #E4DFD3;border-radius:11px;padding:22px;text-align:center;margin-bottom:14px\">\n          <div style=\"width:52px;height:52px;border-radius:50%;background:#F6E1DE;display:flex;align-items:center;justify-content:center;margin:0 auto 12px\"><i data-lucide=\"cloud-off\" style=\"width:26px;height:26px;color:#8F2E24\"><\u002Fi><\u002Fdiv>\n          <div style=\"font-family:'Libre Franklin';font-weight:700;font-size:16px;margin-bottom:6px\">Camp data failed to load<\u002Fdiv>\n          <p style=\"font-size:13px;color:#5C6A5B;line-height:1.5;margin:0 0 14px\">The directory could not be reached. This is usually a connection hiccup.<\u002Fp>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;background:#1D5E42;color:#fff;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:700\"><i data-lucide=\"refresh-cw\" style=\"width:14px;height:14px\"><\u002Fi>Try again<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:12.5px;color:#5C6A5B;line-height:1.5;margin:0\">Because filtering is client-side, this only appears if the one-time data file fails to load. Filter changes never trigger it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 08 COMPONENTS ============ -->\n  <section id=\"components\" style=\"padding:64px 0 0;scroll-margin-top:60px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8A6A2E;margin-bottom:10px\">08 · Component specs<\u002Fdiv>\n    <h2 style=\"font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em;margin:0 0 12px\">One spec per named component<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.55;color:#3C463C;max-width:66ch;margin:0 0 24px\">Names match <span style=\"font-family:'IBM Plex Mono';font-size:14px\">IMPLEMENTATION.md §8.2<\u002Fspan> exactly. Each lists anatomy, states, responsive behavior, and overflow rules.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px\">\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;Filters&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> ZIP input, radius slider, week/date range, max-fee, feature multi-select chips, state, text search, result count, clear-all.<br><strong>States:<\u002Fstrong> default · focused input (accent ring) · active chip (filled primary) · applied (chip in toolbar) · invalid ZIP (danger helper text).<br><strong>Responsive:<\u002Fstrong> 264px left rail ≥1024; bottom sheet + sticky Apply below, opened by the sticky Filters button (shows active count).<br><strong>Overflow:<\u002Fstrong> feature chips collapse to \"+N more\"; long labels truncate, never wrap the row.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;ResultsList&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> result count + sort control, then a vertical stack of CampCard, 12px gap.<br><strong>States:<\u002Fstrong> populated · loading (skeleton cards) · empty (EmptyState) · error.<br><strong>Responsive:<\u002Fstrong> single column all breakpoints; shares viewport with map ≥1024, full-width under the list/map toggle below.<br><strong>Overflow:<\u002Fstrong> virtualized scroll for large sets; sort persists in the URL query.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;CampCard&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> name, council + city/state, distance, next available week, fee-from, up to 3 FeatureChips + \"+N\", ProvenanceBadge / StaleBadge, view affordance.<br><strong>States:<\u002Fstrong> default · hover (primary border, sh-2, marker raised) · focus · selected · loading · stale.<br><strong>Responsive:<\u002Fstrong> distance right-aligned; meta row wraps below name on mobile.<br><strong>Overflow:<\u002Fstrong> name clamps to 2 lines; chips clamp to one row with \"+N\".<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;MapView&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> MapLibre canvas, price markers, count clusters, popup mini-card, zoom controls.<br><strong>States:<\u002Fstrong> marker default / hover / selected · cluster · popup open · loading tiles · reduced-motion (no fly-to).<br><strong>Responsive:<\u002Fstrong> 470px sticky panel ≥1024; full-screen under Map toggle on mobile with a bottom peek card.<br><strong>A11y:<\u002Fstrong> the ResultsList is the accessible equivalent; markers are focusable buttons with aria-labels.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;ProvenanceBadge&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> badge-check icon + \"Verified &lt;Mon YYYY&gt;\" in open-green.<br><strong>States:<\u002Fstrong> verified (green) · flips to StaleBadge when verified_at &gt; 12 mo.<br><strong>Responsive:<\u002Fstrong> full label on card; on detail, expands to \"Source: &lt;council&gt; · Last verified &lt;date&gt;\".<br><strong>Overflow:<\u002Fstrong> source URL truncates with ellipsis, full URL on hover/title.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;FeatureChip&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> 12-16px Lucide icon + label, pill radius.<br><strong>States:<\u002Fstrong> static (card, tint bg) · selectable (filter: default outline / active filled primary) · disabled.<br><strong>Responsive:<\u002Fstrong> icon-only at &lt;340px containers with aria-label kept.<br><strong>Overflow:<\u002Fstrong> never wraps mid-chip; group collapses to \"+N more\".<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;EmptyState&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> icon medallion, headline naming the active filter count, guidance line, primary \"widen radius\", secondary \"clear all\".<br><strong>Variants:<\u002Fstrong> no-results (loosen) · no-ZIP first-run (enter ZIP / browse all).<br><strong>Responsive:<\u002Fstrong> centered column, 30px side padding on mobile.<br><strong>Copy:<\u002Fstrong> names the specific fix; never a dead end.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;StaleBadge&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> alert-triangle + \"Not checked since &lt;YYYY&gt;\", danger-tint pill.<br><strong>States:<\u002Fstrong> card badge (compact) · detail page banner (full-width, top of page).<br><strong>Rule:<\u002Fstrong> shown when now − verified_at &gt; 12 months. Never color-only, always the triangle icon + words.<br><strong>Responsive:<\u002Fstrong> wraps to two lines on the detail banner if needed.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;Header&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> wordmark + logo, nav (Search / About), data-freshness note.<br><strong>States:<\u002Fstrong> current-page underline; sticky on scroll (search).<br><strong>Responsive:<\u002Fstrong> full nav ≥768; hamburger menu at 375, freshness note drops.<br><strong>Height:<\u002Fstrong> 60px desktop / 52px mobile.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">&lt;Footer&gt;<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> wordmark + disclaimer, site links, data-freshness summary, correction link, copyright.<br><strong>States:<\u002Fstrong> static; dark ink surface (#20261F) for separation.<br><strong>Responsive:<\u002Fstrong> 3 columns ≥768, stacks on mobile.<br><strong>Rule:<\u002Fstrong> the unaffiliated disclaimer lives here on every page.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:20px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#1D5E42;margin-bottom:10px\">Sessions table (detail)<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#3C463C\"><strong>Anatomy:<\u002Fstrong> columns week · dates · youth fee · adult fee · status; per-row register link.<br><strong>States per row:<\u002Fstrong> open · waitlist · full (dimmed) · unknown · reg-not-open (\"Opens &lt;date&gt;\") · fee TBD (italic) · dates TBD.<br><strong>Responsive:<\u002Fstrong> 5-col grid ≥768; on mobile each row becomes a stacked card (week + dates + fee left, status pill right).<br><strong>Rows:<\u002Fstrong> designed for 1-8; scrolls if more.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 09 MAP + COPY + A11Y ============ -->\n  <section id=\"map\" style=\"padding:64px 0 0;scroll-margin-top:60px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8A6A2E;margin-bottom:10px\">09 · Map direction · microcopy · accessibility<\u002Fdiv>\n    <h2 style=\"font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em;margin:0 0 24px\">Map, copy &amp; accessibility<\u002Fh2>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:20px\">\n\n      <!-- Map style -->\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:22px\">\n        <h3 style=\"font-family:'Libre Franklin';font-weight:700;font-size:18px;margin:0 0 12px\">Map style direction<\u002Fh3>\n        <p style=\"font-size:13.5px;line-height:1.55;color:#3C463C;margin:0 0 14px\">A muted, low-saturation basemap so markers pop. All achievable with standard MapLibre vector styling, no bespoke cartography.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px\">\n          <div><div style=\"height:38px;border-radius:7px;background:#E6E2D6;border:1px solid #D8D3C6\"><\u002Fdiv><div style=\"font-family:'IBM Plex Mono';font-size:9.5px;color:#5C6A5B;margin-top:4px\">land<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:38px;border-radius:7px;background:#CBD9DE;border:1px solid #D8D3C6\"><\u002Fdiv><div style=\"font-family:'IBM Plex Mono';font-size:9.5px;color:#5C6A5B;margin-top:4px\">water<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:38px;border-radius:7px;background:#D3DBCB;border:1px solid #D8D3C6\"><\u002Fdiv><div style=\"font-family:'IBM Plex Mono';font-size:9.5px;color:#5C6A5B;margin-top:4px\">park<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:38px;border-radius:7px;background:#EFEDE6;border:1px solid #D8D3C6\"><\u002Fdiv><div style=\"font-family:'IBM Plex Mono';font-size:9.5px;color:#5C6A5B;margin-top:4px\">roads<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height:38px;border-radius:7px;background:#B8BEB0;border:1px solid #D8D3C6\"><\u002Fdiv><div style=\"font-family:'IBM Plex Mono';font-size:9.5px;color:#5C6A5B;margin-top:4px\">labels<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:#3C463C\"><strong>Marker:<\u002Fstrong> price pill, white border. Default white / ink; hover + selected fill primary green, lift 2px.<br><strong>Cluster:<\u002Fstrong> primary-green circle, white count, translucent white ring; sizes 36/46/56 by density.<br><strong>Popup:<\u002Fstrong> mini CampCard (name, distance, fee, next week, View camp), 8px offset, arrow to marker.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Microcopy -->\n      <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:22px\">\n        <h3 style=\"font-family:'Libre Franklin';font-weight:700;font-size:18px;margin:0 0 12px\">Microcopy library<\u002Fh3>\n        <div style=\"font-size:13px;line-height:1.7;color:#3C463C\">\n          <div style=\"display:flex;gap:8px;border-bottom:1px dashed #E4DFD3;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">primary CTA<\u002Fspan><span>Visit official council page<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;border-bottom:1px dashed #E4DFD3;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">first run<\u002Fspan><span>Where can your troop go this summer?<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;border-bottom:1px dashed #E4DFD3;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">empty<\u002Fspan><span>No camps match all N filters. Try widening your radius or removing a feature.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;border-bottom:1px dashed #E4DFD3;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">error<\u002Fspan><span>Camp data failed to load. Try again.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;border-bottom:1px dashed #E4DFD3;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">stale<\u002Fspan><span>Not verified since 2024. Confirm details on the council site.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;border-bottom:1px dashed #E4DFD3;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">fee unknown<\u002Fspan><span>Fee TBD · confirm on council site<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;border-bottom:1px dashed #E4DFD3;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">reg not open<\u002Fspan><span>Opens &lt;date&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;border-bottom:1px dashed #E4DFD3;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">correction<\u002Fspan><span>See a problem? Suggest a correction<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;padding:5px 0\"><span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#8A6A2E;flex:0 0 108px\">disclaimer<\u002Fspan><span>Not affiliated with or endorsed by Scouting America. Always confirm details on the official council page.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- A11y -->\n    <div style=\"background:#20261F;border-radius:12px;padding:24px;margin-bottom:20px;color:#DDE2D8\">\n      <h3 style=\"font-family:'Libre Franklin';font-weight:700;font-size:18px;margin:0 0 14px;color:#fff\">Accessibility notes<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;font-size:13.5px;line-height:1.6\">\n        <div><strong style=\"color:#9FD3B0\">Contrast<\u002Fstrong><br>All text pairings pass WCAG AA (ratios annotated in §2). Status pills use dark ink on light tint; none rely on color alone.<\u002Fdiv>\n        <div><strong style=\"color:#9FD3B0\">Focus order<\u002Fstrong><br>Header → filters (ZIP, radius, weeks, fee, features) → sort → each card (name link → view) → map markers → footer. Visible 2px accent ring, 2px offset, everywhere.<\u002Fdiv>\n        <div><strong style=\"color:#9FD3B0\">Map equivalent<\u002Fstrong><br>ResultsList is the accessible equivalent of MapView. Markers are &lt;button&gt;s: aria-label \"Camp Meriwether, 78 miles, from $445, open\". Popup is a focus-trapped dialog.<\u002Fdiv>\n        <div><strong style=\"color:#9FD3B0\">ARIA<\u002Fstrong><br>Filters is a labelled &lt;form&gt; with a live-region \"48 camps\" count. Chips are removable buttons (\"Remove Climbing filter\"). Sheet is role=dialog with aria-modal.<\u002Fdiv>\n        <div><strong style=\"color:#9FD3B0\">Touch &amp; motion<\u002Fstrong><br>Hit targets ≥ 44px. No hover-only actions. prefers-reduced-motion disables map fly-to and card lift.<\u002Fdiv>\n        <div><strong style=\"color:#9FD3B0\">Status<\u002Fstrong><br>open / waitlist / full / stale always pair color + icon + text, so meaning survives for color-blind and screen-reader users.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Build mapping -->\n    <div style=\"background:#fff;border:1px solid #D8D3C6;border-radius:12px;padding:24px\">\n      <h3 style=\"font-family:'Libre Franklin';font-weight:700;font-size:18px;margin:0 0 14px\">How this maps to the build<\u002Fh3>\n      <div style=\"font-size:13.5px;line-height:1.9\">\n        <div style=\"display:flex;gap:14px;border-bottom:1px solid #EEEAE0;padding:6px 0\"><span style=\"flex:0 0 200px;font-family:'IBM Plex Mono';font-size:12px;color:#1D5E42\">§4 · Frame<\u002Fspan><span style=\"font-weight:600\">Page / components<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:14px;border-bottom:1px solid #EEEAE0;padding:6px 0\"><span style=\"flex:0 0 200px;font-family:'IBM Plex Mono';font-size:12px;color:#8A6A2E\">04 Home / Search<\u002Fspan><span><code style=\"font-family:'IBM Plex Mono';font-size:12.5px\">/<\u002Fcode> · Header, Filters, ResultsList, CampCard, MapView, EmptyState, sort<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:14px;border-bottom:1px solid #EEEAE0;padding:6px 0\"><span style=\"flex:0 0 200px;font-family:'IBM Plex Mono';font-size:12px;color:#8A6A2E\">05 Camp detail<\u002Fspan><span><code style=\"font-family:'IBM Plex Mono';font-size:12.5px\">/camps/[id]<\u002Fcode> · Header, mini MapView, sessions table, FeatureChip, ProvenanceBadge, StaleBadge, CTA, Footer<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:14px;border-bottom:1px solid #EEEAE0;padding:6px 0\"><span style=\"flex:0 0 200px;font-family:'IBM Plex Mono';font-size:12px;color:#8A6A2E\">06 About<\u002Fspan><span><code style=\"font-family:'IBM Plex Mono';font-size:12.5px\">/about<\u002Fcode> · Header, prose type system, Footer<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:14px;border-bottom:1px solid #EEEAE0;padding:6px 0\"><span style=\"flex:0 0 200px;font-family:'IBM Plex Mono';font-size:12px;color:#8A6A2E\">06 404<\u002Fspan><span><code style=\"font-family:'IBM Plex Mono';font-size:12.5px\">/404<\u002Fcode> · Header, EmptyState variant, Footer<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:14px;padding:6px 0\"><span style=\"flex:0 0 200px;font-family:'IBM Plex Mono';font-size:12px;color:#8A6A2E\">02 Tokens<\u002Fspan><span><code style=\"font-family:'IBM Plex Mono';font-size:12.5px\">tokens.css<\u002Fcode> + <code style=\"font-family:'IBM Plex Mono';font-size:12.5px\">tailwind.config<\u002Fcode> theme fragment<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"text-align:center;padding:56px 0 0;color:#8A8577;font-family:'IBM Plex Mono';font-size:12px\">Camp Finder · design handoff v1 · end of package<\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount(){ this._icons(); }\n  componentDidUpdate(){ this._icons(); }\n  _icons(){\n    const run = () => { if (window.lucide) window.lucide.createIcons(); };\n    if (window.lucide) run(); else setTimeout(run, 300);\n    setTimeout(run, 800);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
